[package]
name = "zakura-nat-lab"
version = "0.1.0"
edition = "2021"
publish = false

# Keep relay/server and simulation dependencies out of the production graph.
[workspace]

[dependencies]
anyhow = "1"
blake2b_simd = "1"
iroh = { package = "zakura-iroh", version = "=1.1.0-rc.1", default-features = false, features = ["tls-ring"] }
iroh-relay = { package = "zakura-iroh-relay", version = "=1.1.0-rc.1", default-features = false, features = ["tls-ring", "test-utils"] }
patchbay = "=0.7.0"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zakura-network = { path = "../../crates/zakura-network" }
zakura-chain = { path = "../../crates/zakura-chain" }
